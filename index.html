<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Hiểu Giáo Dục STEM - KHTN 9 Bài 3: Cơ Năng</title>
    <style>
        :root {
            --bg-dark: #0b132b;
            --bg-card: #ffffff;
            --primary-orange: #ff6b00;
            --primary-blue: #1c2541;
            --accent-blue: #4895ef;
            --text-dark: #1c2541;
            --text-muted: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #ff9e00;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 158, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #a0aec0;
            margin-top: 5px;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: var(--text-dark);
        }

        .form-title {
            text-align: center;
            color: #1e3a8a;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-blue);
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-practice {
            background-color: #cbd5e1;
            color: #334155;
        }

        .btn-test {
            background-color: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Screen Interfaces */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .question-title {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .option-item {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #718096;
        }

        .admin-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #a0aec0;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>TÌM HIỂU GIÁO DỤC STEM</h1>
        <p>Chuyên đề: Tìm hiểu giáo dục STEM - Bài 3: Cơ Năng</p>
    </header>

    <div class="container">
        <!-- ĐĂNG NHẬP -->
        <div id="login-screen" class="screen active">
            <div class="form-title">NHẬP THÔNG TIN THÍ SINH</div>
            
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" id="fullname" placeholder="Nhập đầy đủ họ tên" value="Ngô Bảo Châu">
            </div>

            <div class="form-group">
                <label>Trường:</label>
                <input type="text" id="school" placeholder="Tên trường học" value="THCS Nguyễn Chí Diểu">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phường / xã:</label>
                    <input type="text" id="ward" placeholder="Phường/Xã" value="Thuận Hoá">
                </div>
                <div class="form-group">
                    <label>Số báo danh:</label>
                    <input type="text" id="sbd" placeholder="SBD" value="321">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-practice" id="btn-practice">LUYỆN TẬP</button>
                <button class="btn btn-test" id="btn-test">KIỂM TRA</button>
            </div>
        </div>

        <!-- MÀN HÌNH BÀI LÀM -->
        <div id="game-screen" class="screen">
            <div id="quiz-container"></div>
            <button class="btn btn-test" style="width:100%; margin-top:15px;" onclick="submitQuiz()">NỘP BÀI</button>
        </div>
    </div>

    <footer>
        <p><strong>TÌM HIỂU GIÁO DỤC STEM</strong></p>
        <p>Bản quyền thuộc về Thạc sĩ Nguyễn Văn Cần, Trường THCS Thanh Thuỷ, Thành phố Huế</p>
        <div class="admin-btn">QUẢN TRỊ 🔒</div>
    </footer>

    <script>
        // 1. DỮ LIỆU NGÂN HÀNG CÂU HỎI (Đã đồng bộ khai báo tên biến BANK_MCQ)
        const BANK_MCQ = [
            {
                id: 1,
                question: "Cơ năng của một vật phụ thuộc vào yếu tố nào?",
                options: ["Động năng và thế năng", "Vận tốc và khối lượng", "Độ cao và khối lượng", "Vận tốc và nhiệt độ"],
                correct: 0
            },
            {
                id: 2,
                question: "Vật nào sau đây có thế năng trọng trường?",
                options: ["Quả bóng đang lăn trên mặt đất", "Quả táo đang ở trên cành cây", "Lò xo bị co lại", "Dòng điện đang chạy"],
                correct: 1
            },
            {
                id: 3,
                question: "Đơn vị đo cơ năng trong hệ SI là gì?",
                options: ["Oát (W)", "Niu-tơn (N)", "Jun (J)", "Mét trên giây (m/s)"],
                correct: 2
            }
        ];

        // 2. KHỞI TẠO GAME VÀ XỬ LÝ LỖI KHÔNG TÌM THẤY BIẾN
        function initGame(mode) {
            console.log("Khởi tạo bài thi/luyện tập, chế độ:", mode);

            // Kiểm tra an toàn biến BANK_MCQ
            if (typeof BANK_MCQ === 'undefined' || !BANK_MCQ) {
                alert("Lỗi: Không tìm thấy ngân hàng câu hỏi (BANK_MCQ)!");
                return;
            }

            const name = document.getElementById('fullname').value.trim();
            if (!name) {
                alert("Vui lòng nhập họ và tên trước khi bắt đầu!");
                return;
            }

            // Chuyển màn hình
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            // Render câu hỏi
            renderQuiz(BANK_MCQ);
        }

        // 3. HIỂN THỊ CÂU HỎI
        function renderQuiz(questions) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                
                let html = `<div class="question-title">Câu ${index + 1}: ${q.question}</div>`;
                q.options.forEach((opt, optIndex) => {
                    html += `
                        <label class="option-item">
                            <input type="radio" name="q_${q.id}" value="${optIndex}">
                            ${opt}
                        </label>
                    `;
                });
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // 4. NỘP BÀI
        function submitQuiz() {
            alert("Nộp bài thành công!");
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
        }

        // 5. BẮT SỰ KIỆN NÚT BẤM (Dòng 789)
        document.addEventListener("DOMContentLoaded", function() {
            const btnPractice = document.getElementById('btn-practice');
            const btnTest = document.getElementById('btn-test');

            if (btnPractice) {
                btnPractice.onclick = function() {
                    initGame('practice');
                };
            }

            if (btnTest) {
                btnTest.onclick = function() {
                    initGame('test');
                };
            }
        });
    </script>
</body>
</html>
